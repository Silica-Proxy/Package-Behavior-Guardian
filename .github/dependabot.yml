version: 2
updates:
  # Configuration to update Java / Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  # Configuration to keep GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images of the Dockerfile, pinned by digest (tag kept): Dependabot bumps the digest
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # GuardDog's hash-pinned locks (pip-compile files in docker/)
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"

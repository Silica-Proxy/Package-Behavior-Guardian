services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=packagebehaviorguardian'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      # Host port 5434: SilicaProxy binds 5432 and Package-Name-Guardian 5433 on the host.
      - '5434:5432'

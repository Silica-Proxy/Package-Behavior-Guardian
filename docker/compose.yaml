# Production-like Package-Behavior-Guardian stack, joined to SilicaProxy's Docker network.
#
#   cp .env.example .env                                     # then set the passwords and API keys
#   docker compose up -d                                     # PostgreSQL + 2 replicas
#   docker compose up -d --scale packagebehaviorguardian=4   # more analysis capacity
#
# One image, every replica identical: each answers SilicaProxy, analyzes queued jobs and sends
# callbacks. Replicas are stateless and coordinate through PostgreSQL only (jobs and callbacks are
# claimed with SELECT ... FOR UPDATE SKIP LOCKED), so they can be added or removed at any time.
# SilicaProxy calls http://packagebehaviorguardian:8101/v1/check (Docker DNS round-robin).
# For local development, use the compose.yaml at the repository root instead.

name: packagebehaviorguardian

services:
  packagebehaviorguardian:
    image: ${PBG_IMAGE:-silicaproxy/packagebehaviorguardian:latest}
    build:
      context: ..
    restart: unless-stopped
    # GuardDog and malcontent run under a uid of their job, never as the service (see
    # docker/scanner-exec.c): the launcher is the image's only file with capabilities, CAP_SETUID and
    # CAP_SETGID, the only two left to the container. no-new-privileges must stay off here, or the
    # kernel would ignore them and every scan would fail (jobs FAILED, never a verdict):
    # scanner-exec sets it on the scanners themselves.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:false
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/packagebehaviorguardian
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Small pool: replicas x pool size must stay below PostgreSQL's max_connections (see below).
      - HIKARI_MAX_POOL_SIZE=${PBG_DB_POOL_SIZE:-5}
      - HIKARI_MIN_IDLE=1
      # Must equal the api-key of this service in SilicaProxy: it is also sent back on callbacks.
      - PACKAGEBEHAVIORGUARDIAN_API_KEY=${PBG_API_KEY:?PBG_API_KEY must be set in .env}
      # Read-only key of GET /v1/reports: never the check key, which could forge callbacks to SilicaProxy.
      - PACKAGEBEHAVIORGUARDIAN_REPORT_API_KEY=${PBG_REPORT_API_KEY:?PBG_REPORT_API_KEY must be set in .env}
      # host:port of SilicaProxy's callback-base-url, as seen on the Docker network.
      - PACKAGEBEHAVIORGUARDIAN_CALLBACK_HOSTS=${PBG_CALLBACK_HOSTS:-silicaproxy:8080}
      - PACKAGEBEHAVIORGUARDIAN_PUBLIC_BASE_URL=${PBG_PUBLIC_BASE_URL:-}
      # Analyses in parallel per replica: about half the CPUs given to the container.
      - PACKAGEBEHAVIORGUARDIAN_QUEUE_CONCURRENCY=${PBG_CONCURRENCY:-2}
      - LOGGING_LEVEL_COM_SILICAPROXY_PACKAGEBEHAVIORGUARDIAN=${PBG_LOG_LEVEL:-INFO}
      # Expected behaviors (allowlist.yaml next to this file, reviewed by pull request); applied on restart.
      - SPRING_CONFIG_IMPORT=optional:file:/config/allowlist.yaml
    volumes:
      - ./allowlist.yaml:/config/allowlist.yaml:ro
    deploy:
      replicas: ${PBG_REPLICAS:-2}
      resources:
        limits:
          cpus: ${PBG_CPUS:-4}
          memory: ${PBG_MEMORY_LIMIT:-3g}
    networks:
      - internal
      - silicaproxy
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://localhost:8101/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    # Room for every replica's pool: PBG_REPLICAS x PBG_DB_POOL_SIZE, plus margin.
    command: postgres -c max_connections=${PBG_POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      - POSTGRES_DB=packagebehaviorguardian
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: ${PBG_POSTGRES_MEMORY_LIMIT:-1g}
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d packagebehaviorguardian']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Database traffic only; no route outside.
  internal:
    internal: true
  # SilicaProxy's network (created by its own docker/compose.yaml): checks come in, callbacks go
  # out. Its default bridge also gives the replicas their egress to the registries.
  silicaproxy:
    name: ${SILICAPROXY_NETWORK:-silicaproxy}
    external: true

volumes:
  postgres-data:

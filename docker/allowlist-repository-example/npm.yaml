# Example of the allowlist files of the GitOps repository (packagebehaviorguardian.gitops): copy
# npm.yaml, pypi.yaml and maven.yaml to the repository directory set by PBG_GITOPS_PATH, then change
# them by reviewed pull request. The ecosystem is the file name. A merged change applies within
# sync-interval-minutes + 30 s, also to versions already analyzed.
#
# allowlist:
#   - name: esbuild                # Maven: groupId:artifactId; PyPI names are normalized (PEP 503)
#     version: 0.25.0              # optional: without it, also covers future (possibly compromised) releases
#     rule-id: GDG-RISK            # optional: every rule when absent; GDG-RISK also covers the GDG-<rule> risks
#     detail: install hooks        # optional: only findings whose message or location contain it
#     reason: downloads its platform binary at install, reviewed 2026-10-28
#
# An invalid entry (unknown key, missing name or reason, blank value) is skipped and turns the
# `gitops` health DEGRADED; a file that is not valid YAML keeps the entries in force.
allowlist: []

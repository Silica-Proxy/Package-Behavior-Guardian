spring:
  application:
    name: packagebehaviorguardian

  web:
    error:
      # 400s carry this service's own messages (e.g. "The callback URL host is not allowed: ..."),
      # never package content: worth returning to the caller.
      include-message: always

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/packagebehaviorguardian}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:1500}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

logging:
  level:
    com.silicaproxy.packagebehaviorguardian: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,database
        liveness:
          include: livenessState
      status:
        order: down,out-of-service,degraded,up,unknown

packagebehaviorguardian:
  security:
    # Set to false only for local dev / tests: every endpoint becomes unauthenticated.
    enabled: "${PACKAGEBEHAVIORGUARDIAN_SECURITY_ENABLED:true}"
    # Held by SilicaProxy (its services.<name>.api-key): sent on POST /v1/check and sent back on
    # callbacks. Blank = every check refused.
    api-key: "${PACKAGEBEHAVIORGUARDIAN_API_KEY:}"
    # Read-only key of GET /v1/reports, for the people investigating a block. Blank = reports refused.
    report-api-key: "${PACKAGEBEHAVIORGUARDIAN_REPORT_API_KEY:}"

  intake:
    # Exact hosts (or host:port) artifacts and registry metadata may be fetched from, on every
    # redirect hop too. Add your SilicaProxy host if registries are reached through it.
    allowed-artifact-hosts:
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
      - repo1.maven.org
      - repo.maven.apache.org
    # SilicaProxy instance(s) allowed as callback targets. Empty = every check is refused (fail closed).
    allowed-callback-hosts: ${PACKAGEBEHAVIORGUARDIAN_CALLBACK_HOSTS:}

  artifact:
    max-size-mb: 200
    max-files-per-version: 60
    work-dir: ${PACKAGEBEHAVIORGUARDIAN_WORK_DIR:}

  registries:
    # JSON API listing every file of a PyPI version (/pypi/{name}/{version}/json).
    pypi-url: https://pypi.org
    # Hosts serving the files pypi-url lists, besides pypi-url's own host. A PyPI check whose
    # artifact URL is on another host is refused (400): pypi-url's list would describe another
    # index's package. Behind a mirror, point pypi-url at the mirror's PyPI JSON API and list its
    # file host here.
    pypi-file-hosts:
      - files.pythonhosted.org

  queue:
    poll-interval-ms: 1000
    concurrency: 4
    max-attempts: 3
    retry-backoff-seconds: 60
    # Keep below SilicaProxy's pending-ttl-minutes for this service.
    max-wait-minutes: 30
    # A job still running after this is presumed stuck: interrupted and left to another worker.
    max-job-minutes: 30

  callback:
    poll-interval-ms: 2000
    # Exponential backoff capped at max-backoff-seconds: 10, 20, 40, 80, 160, then every 300 s.
    # 11 attempts keep retrying for ~30 min (30 min 10 s) -- as long as queue.max-wait-minutes,
    # and below SilicaProxy's pending-ttl-minutes -- so a restart or short outage of SilicaProxy
    # does not lose the verdict. Retrying longer is useless: once the token expired, SilicaProxy
    # answers 404 and the callback is dropped anyway.
    max-attempts: 11
    initial-backoff-seconds: 10
    max-backoff-seconds: 300

  retention:
    # DONE and FAILED jobs neither updated nor checked for this many days are deleted with their
    # results; PENDING/RUNNING jobs and jobs with callbacks waiting are kept. A purged version is
    # re-analyzed on its next check. Keep it above SilicaProxy's cache-ttl-minutes, so reports
    # linked from verdicts still cached there stay available. 0 = keep everything.
    days: 90
    # Audit trail (analysis_audit, check_audit): rows older than this are deleted, whatever became
    # of their job. 0 = keep everything.
    analysis-audit-days: ${PACKAGEBEHAVIORGUARDIAN_ANALYSIS_AUDIT_DAYS:365}
    check-audit-days: ${PACKAGEBEHAVIORGUARDIAN_CHECK_AUDIT_DAYS:365}
    # Purges run on one instance at a time (ShedLock, table shedlock).
    purge-interval-ms: 3600000

  analysis:
    # Bump when rules or severities change: older results are re-analyzed on the next check.
    rule-set-version: "2"
    public-base-url: ${PACKAGEBEHAVIORGUARDIAN_PUBLIC_BASE_URL:}
    # Files of one version scanned at the same time. Each external scanner is one process per file:
    # an instance runs up to queue.concurrency × scan-parallelism of them. Ignored (1) under
    # scanners.isolation: a job's scanners share its uid and scanner-exec kills that uid's processes.
    scan-parallelism: ${PACKAGEBEHAVIORGUARDIAN_SCAN_PARALLELISM:2}
    # Findings per (file SHA-256, scanner, rule set), reused instead of scanning the same file again.
    scan-cache-enabled: true
    # Older entries (and those of any other rule set) are purged: a tool upgrade is seen after this.
    scan-cache-max-age-days: 30
    # Verdict scale: each rule counts once at its highest severity, LOW = 0, a CRITICAL blocks alone.
    # A score >= block-threshold blocks with "manual review required". With 40/20/60: a HIGH and
    # a MEDIUM, two HIGH or three MEDIUM block; a lone HIGH or two MEDIUM do not. Takes effect on the
    # next check of any version (verdicts are recomputed from stored findings): every instance must
    # use the same scale, or the same version gets different verdicts depending on who answers.
    high-weight: ${PACKAGEBEHAVIORGUARDIAN_HIGH_WEIGHT:40}
    medium-weight: ${PACKAGEBEHAVIORGUARDIAN_MEDIUM_WEIGHT:20}
    block-threshold: ${PACKAGEBEHAVIORGUARDIAN_BLOCK_THRESHOLD:60}

  scanners:
    # The image runs GuardDog and malcontent through scanner-exec, each job under a uid of its own
    # (see docker/scanner-exec.c): it sets both commands and isolation.first-gid. Blank = the
    # scanners run as this service (development).
    isolation:
      first-gid: ${PACKAGEBEHAVIORGUARDIAN_SCANNERS_ISOLATION_FIRSTGID:}
      slots: ${PACKAGEBEHAVIORGUARDIAN_SCANNERS_ISOLATION_SLOTS:64}
    guarddog:
      enabled: true
      command: [guarddog]
      timeout-seconds: 300
    malcontent:
      enabled: true
      command: [mal]
      timeout-seconds: 300
      # Third-party rules have heterogeneous licenses, some forbidding hosted use: opt in knowingly.
      third-party-rules: false
    bytecode:
      enabled: true
      known-annotation-processor-groups:
        - org.projectlombok
        - org.mapstruct
        - com.google.auto
        - com.google.dagger
        - com.google.errorprone
        - org.immutables
        - org.hibernate
        - io.micronaut
        - io.quarkus
        - org.springframework
        - info.picocli
        - com.querydsl
        - jakarta
        - org.checkerframework

  # Expected behaviors, set aside from a package's verdict, kept in a Git repository reviewed by pull
  # request (GitOps, as SilicaProxy's company policies): one instance at a time fetches it every
  # sync-interval-minutes and every instance applies the new entries within refresh-interval-seconds,
  # also to versions already analyzed. Files, under `path` in the repository (ecosystem = file name):
  #   npm.yaml / pypi.yaml / maven.yaml  (or .yml)
  #     allowlist:
  #       - name: esbuild                # Maven: groupId:artifactId
  #         version: 0.25.0              # optional: without it, also covers future (possibly compromised) releases
  #         rule-id: GDG-RISK            # optional: every rule when absent; GDG-RISK also covers the GDG-<rule> risks
  #         detail: install hooks        # optional: only findings whose message/location contain it
  #         reason: downloads its platform binary at install, reviewed 2026-10-28
  # An invalid entry (unknown key, no name or reason) is skipped; an unreadable file or a fetch failure
  # keeps the entries in force. Both turn the `gitops` health DEGRADED.
  gitops:
    enabled: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_ENABLED:false}
    # HTTPS URL; credentials go in token, never in the URL.
    repository-url: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_REPOSITORY_URL:}
    # Blank = the default branch (remote HEAD).
    branch: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_BRANCH:}
    # Directory of the repository holding the files, e.g. "package-behavior-guardian" to share
    # SilicaProxy's policy repository. Blank = the root.
    path: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_PATH:}
    username: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_USERNAME:oauth2}
    token: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_TOKEN:}
    # Local working copy. Blank = <java.io.tmpdir>/pbg-allowlist-git.
    clone-dir: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_CLONE_DIR:}
    sync-interval-minutes: ${PACKAGEBEHAVIORGUARDIAN_GITOPS_SYNC_INTERVAL_MINUTES:10}
    refresh-interval-seconds: 30
    # gitops health turns DEGRADED when the last successful synchronization is older than this.
    max-age-minutes: 60

  # Outbound proxy of the company network (same settings as SilicaProxy's corporate-proxy). Each
  # category of outgoing traffic goes through it or not; hosts of non-proxy-hosts are always direct.
  # A category in scope fails when the proxy is unreachable: it never silently goes direct.
  corporate-proxy:
    enabled: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_ENABLED:false}
    host: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_HOST:}
    port: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_PORT:8080}
    # "|"-separated host names, "*" wildcards, e.g. "localhost|127.0.0.1|*.corp.local"
    non-proxy-hosts: "${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_NON_PROXY_HOSTS:localhost|127.0.0.1}"
    scope:
      # Public registries: artifacts and PyPI metadata (npm, PyPI, Maven Central)
      registries: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_SCOPE_REGISTRIES:true}
      # GitOps allowlist repository: usually inside the company network
      git-repository: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_SCOPE_GIT_REPOSITORY:false}
      # Callbacks to SilicaProxy: usually inside the company network
      callbacks: ${PACKAGEBEHAVIORGUARDIAN_CORPORATE_PROXY_SCOPE_CALLBACKS:false}

  # Static entries (same fields, plus ecosystem), applied on restart together with the GitOps ones:
  # for local development and tests; prefer the Git repository in production.
  allowlist: []

server:
  port: 8101
